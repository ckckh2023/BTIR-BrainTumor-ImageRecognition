<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BTIR 彩蛋小游戏：在移动扫描线抵达前标记异常信号并完成安全区域扫描。">
    <title>BTIR · 扫瘤行动</title>
    <link rel="icon" type="image/png" href="./assets/icon_exp.png?v=2">
    <script src="./js/theme-init.js"></script>
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/game.css">
</head>
<body>
    <header class="game-header">
        <a class="game-brand" href="index.html"><span class="game-logo" aria-hidden="true"></span><div><strong>BTIR</strong><span>隐藏实验室 / EASTER EGG</span></div></a>
        <div class="game-header-actions"><button id="soundToggle" class="round-button" type="button" aria-label="切换游戏音效" title="切换游戏音效"><svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5.2a4 4 0 0 1 0 5.6M19 6.6a7.5 7.5 0 0 1 0 10.8"/></svg><svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12 1 5 5m0-5-5 5"/></svg></button><button id="gameTheme" class="round-button" type="button" aria-label="切换明暗主题" title="切换明暗主题"><svg class="moon-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.4 12.2A6.8 6.8 0 0 1 7.8 3.6a6.8 6.8 0 1 0 8.6 8.6Z"/></svg><svg class="sun-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.2"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4"/></svg></button><a class="back-button" href="index.html" aria-label="返回展示页" title="返回展示页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 6-6 6 6 6m-5-6h10"/></svg></a></div>
    </header>

    <main class="game-shell">
        <section class="mission-copy">
            <span class="mission-kicker">BTIR SIDE MISSION / 01</span>
            <h1>扫瘤行动</h1>
            <p>扫描安全区域，标记异常信号。</p>
        </section>

        <section class="game-layout">
            <aside class="control-panel">
                <div class="panel-heading"><span>任务参数</span><b>MISSION</b></div>
                <div class="difficulty-block">
                    <label>选择难度</label>
                    <div class="difficulty-list" id="difficultyList">
                        <button type="button" data-difficulty="easy" class="active"><strong>简单</strong><b>8 × 8</b></button>
                        <button type="button" data-difficulty="normal"><strong>普通</strong><b>12 × 12</b></button>
                        <button type="button" data-difficulty="hard"><strong>困难</strong><b>16 × 16</b></button>
                        <button type="button" data-difficulty="extreme" class="extreme-difficulty"><strong>极难</strong><b>全屏 20 × 20</b></button>
                        <button type="button" data-difficulty="escape" class="escape-difficulty"><strong>逃生模式</strong><b>60 秒 · 3 HP</b></button>
                    </div>
                </div>
                <button class="restart-button" id="restartButton" type="button"><span>↻</span> 重新开始</button>
            </aside>

            <section class="game-console" aria-labelledby="boardTitle">
                <div class="console-header">
                    <div><span class="live-dot"></span><strong id="boardTitle">扫描区域 A-01</strong></div>
                    <span id="gameStatus" class="game-status idle">等待首次扫描</span>
                </div>
                <div class="hud">
                    <div><span>剩余异常</span><strong id="mineCounter">10</strong></div>
                    <div><span>任务用时</span><strong id="timerValue">00:00</strong></div>
                    <div><span>扫描进度</span><strong id="progressValue">0%</strong></div>
                    <div class="threat-meter"><span>威胁等级</span><strong id="threatValue">低</strong><i><b id="threatBar"></b></i></div>
                </div>
                <div class="board-stage" id="boardStage">
                    <div class="stage-grid" aria-hidden="true"></div>
                    <div class="threat-preview-layer" id="threatPreviewLayer" aria-hidden="true"></div>
                    <div class="brain-actor brain-one" aria-hidden="true"><div class="ambient-brain"></div><i></i></div>
                    <div class="brain-actor brain-two" aria-hidden="true"><div class="ambient-brain"></div><i></i></div>
                    <div class="board-wrap"><div id="gameBoard" class="game-board" role="grid" aria-label="扫瘤游戏棋盘"></div></div>
                    <div class="stage-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
                </div>
                <div class="console-footer"><span><i></i> 左键扫描 · 右键标记 · 方向键移动</span><span id="footerMessage">选择任意区域开始任务</span></div>
            </section>
        </section>
    </main>

    <div class="result-modal" id="resultModal" hidden>
        <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
            <span class="result-symbol" id="resultSymbol">✓</span><span class="result-kicker">MISSION REPORT</span><h2 id="resultTitle">扫描任务完成</h2><p id="resultText"></p>
            <div class="result-stats"><div><span>用时</span><strong id="resultTime">00:00</strong></div><div><span>扫描率</span><strong id="resultProgress">100%</strong></div><div><span>难度</span><strong id="resultDifficulty">简单</strong></div></div>
            <div class="result-actions"><button id="playAgain" type="button">再来一局</button><a href="index.html">返回展示页</a></div>
        </div>
    </div>
    <div class="toast" id="gameToast" role="status"></div>
    <script src="./js/game.js"></script>
</body>
</html>
