<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脑肿瘤MRI图像识别</title>
    <link rel="preconnect" href="https://unpkg.com">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(180deg, #1a3a6b 0%, #2d5aa0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            display: flex;
            gap: 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 95vw;
            max-width: 1400px;
            height: calc(100vh - 40px);
            max-height: 1000px;
        }

        .left-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .right-panel {
            flex: 2;
            border-left: 2px solid #e8f0f8;
            padding-left: 24px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 28px;
            font-size: 26px;
            flex-shrink: 0;
        }

        .input-group {
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2a5298;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .input-wrapper input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #b8d4e8;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-wrapper input[type="text"]:focus {
            outline: none;
            border-color: #335fb1;
            box-shadow: 0 0 0 3px rgb(255, 255, 255);
        }

        .browse-btn {
            flex-shrink: 0;
            width: auto;
            min-width: 80px;
            padding: 12px 16px;
            white-space: nowrap;
            background: linear-gradient(160deg, #2c3e66 0%, #1a2744 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .browse-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.4);
        }

        .browse-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .browse-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .drop-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgb(255, 255, 255);
            color: #707070;
            font-size: 14px;
            border: 2px solid #b8d4e8;
            border-radius: 8px;
            z-index: 10;
            pointer-events: none;
        }

        button.recognize-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(160deg, #2c3e66 0%, #1a2744 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        button.recognize-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.4);
        }

        button.recognize-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        button.recognize-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-top: 2px solid #e8f0f8;
            margin-top: 20px;
            padding-top: 20px;
            min-height: 0;
        }

        .result-title {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .result-box {
            background: #f7fafc;
            border-radius: 8px;
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .result-item {
            margin-bottom: 12px;
        }

        .result-label {
            color: #4a5568;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .result-value {
            color: #1e3c72;
            font-size: 14px;
            word-break: break-all;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .result-highlight {
            color: #38a169;
            font-weight: 600;
            font-size: 16px;
        }

        .result-highlight.detected {
            color: #e53e3e;
        }

        .status-loading {
            color: #2a5298;
            font-style: italic;
        }

        .status-error {
            color: #e53e3e;
        }

        .status-success {
            color: #38a169;
        }

        .right-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 12px;
        }

        .right-title {
            color: #1e3c72;
            font-size: 18px;
            font-weight: 600;
        }

        .copy-btn {
            flex-shrink: 0;
            padding: 6px 14px;
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #475569;
        }

        .file-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
            margin-bottom: 12px;
        }

        .file-tab {
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            white-space: nowrap;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-tab:hover {
            background: #e2e8f0;
        }

        .file-tab.active {
            background: #1e3c72;
            color: white;
            border-color: #1e3c72;
        }

        .file-tab.loading {
            opacity: 0.6;
            cursor: wait;
        }

        .json-viewer {
            flex: 1;
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            overflow-y: auto;
            min-height: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .json-viewer .key {
            color: #60a5fa;
        }
        .json-viewer .string {
            color: #a5d6a7;
        }
        .json-viewer .number {
            color: #ffcc80;
        }
        .json-viewer .boolean {
            color: #ce93d8;
        }
        .json-viewer .null {
            color: #ef9a9a;
            font-style: italic;
        }

        .json-placeholder {
            color: #94a3b8;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #e8f0f8;
            border-top: 3px solid #407eb8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .copy-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #e2e8f0;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .copy-toast.show {
            opacity: 1;
        }

        .file-fetch-error {
            color: #ef9a9a;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <div class="left-panel">
                <h1>脑肿瘤MRI图像识别</h1>

                <div class="input-group">
                    <label for="selectedFileName">已选择图片：</label>
                    <div class="input-row">
                        <div class="input-wrapper"
                             @dragenter.prevent="onDragEnter"
                             @dragover.prevent="onDragOver"
                             @dragleave.prevent="onDragLeave"
                             @drop.prevent="onDrop">
                            <input
                                type="text"
                                id="selectedFileName"
                                :value="selectedFile ? selectedFile.name : ''"
                                placeholder="请选择或拖拽图片文件"
                                readonly
                                @click="triggerFilePicker"
                            />
                            <div class="drop-hint" v-if="isDragOver">
                                <span>释放上传</span>
                            </div>
                        </div>
                        <button class="browse-btn" @click="triggerFilePicker" :disabled="loading">
                            浏览...
                        </button>
                    </div>
                    <input
                        type="file"
                        ref="fileInput"
                        accept=".jpg,.jpeg,.png,.bmp,.tif,.tiff,.webp,.gif,.dcm,.dicom"
                        style="display: none"
                        @change="onFileSelected"
                    />
                </div>

                <button class="recognize-btn" @click="recognizeFromUpload" :disabled="loading || !selectedFile">
                    {{ loading ? '识别中...' : '识别' }}
                </button>

                <div class="result-section">
                    <div class="result-title">识别结果</div>
                    <div class="result-box">
                        <div class="result-item">
                            <div class="result-label">状态：</div>
                            <div class="result-value" v-html="statusText"></div>
                        </div>
                        <div class="result-item" v-if="taskId">
                            <div class="result-label">任务ID：</div>
                            <div class="result-value">{{ taskId }}</div>
                        </div>
                        <div class="result-item" v-if="classificationLabel">
                            <div class="result-label">分类结果：</div>
                            <div class="result-value">
                                <span :class="['result-highlight', classificationLabel === '肿瘤 detected' ? 'detected' : '']">
                                    {{ classificationLabel }}
                                </span>
                                <span v-if="confidence">（置信度：{{ (confidence * 100).toFixed(1) }}%）</span>
                            </div>
                        </div>
                        <div class="result-item" v-if="tumorArea !== null">
                            <div class="result-label">肿瘤占比：</div>
                            <div class="result-value">{{ (tumorArea * 100).toFixed(2) }}%</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="right-header">
                    <div class="right-title">JSON 解析</div>
                    <button class="copy-btn" v-if="selectedFileContent" @click="copyJson">复制</button>
                </div>
                <div class="file-tabs" v-if="fileList.length">
                    <div
                        v-for="f in fileList"
                        :key="f.path"
                        :class="['file-tab', { active: selectedFilePath === f.path, loading: fileLoading && selectedFilePath === f.path }]"
                        @click="selectFile(f)"
                    >{{ f.label }}</div>
                </div>
                <div class="json-viewer" v-if="selectedFileContent" v-html="syntaxHighlight(selectedFileContent)"></div>
                <div class="json-viewer json-placeholder" v-else>
                    {{ statusText.includes('等待') ? '等待识别...' : (fileList.length ? '选择文件查看' : '暂无数据') }}
                </div>
            </div>
        </div>

        <div class="copy-toast" :class="{ show: showToast }">已复制到剪贴板</div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    API_BASE: 'http://127.0.0.1:8000',
                    loading: false,
                    statusText: '等待识别...',
                    taskId: '',
                    jsonPath: '',
                    jsonData: '',
                    selectedFile: null,
                    isDragOver: false,
                    showToast: false,
                    classificationLabel: '',
                    confidence: 0,
                    tumorArea: null,
                    fileList: [],
                    selectedFilePath: '',
                    selectedFileContent: '',
                    fileLoading: false,
                }
            },
            methods: {
                syntaxHighlight(json) {
                    if (!json) return ''
                    const escaped = json
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                    return escaped.replace(
                        /("(?:[^"\\]|\\.)*")\s*:/g,
                        '<span class="key">$1</span>:'
                    ).replace(
                        /("(?:[^"\\]|\\.)*")/g,
                        '<span class="string">$1</span>'
                    ).replace(
                        /\b(-?\d+\.?\d*(?:[eE][+-]?\d+)?)\b/g,
                        '<span class="number">$1</span>'
                    ).replace(
                        /\b(true|false)\b/g,
                        '<span class="boolean">$1</span>'
                    ).replace(
                        /\bnull\b/g,
                        '<span class="null">null</span>'
                    )
                },
                resetState() {
                    this.loading = true
                    this.statusText = '<span class="loading-spinner"></span>创建任务中...'
                    this.taskId = ''
                    this.jsonPath = ''
                    this.jsonData = ''
                    this.fileList = []
                    this.selectedFilePath = ''
                    this.selectedFileContent = ''
                    this.classificationLabel = ''
                    this.confidence = 0
                    this.tumorArea = null
                },
                buildFileList(resultData) {
                    const files = []
                    if (resultData.result_files) {
                        const rf = resultData.result_files
                        if (rf.frontend) files.push({ label: 'frontend_result.json', path: rf.frontend })
                        if (rf.classification) files.push({ label: 'classification.json', path: rf.classification })
                        if (rf.segmentation) files.push({ label: 'segmentation.json', path: rf.segmentation })
                    }
                    if (resultData.latest_runs) {
                        const lr = resultData.latest_runs
                        if (lr.classification) {
                            const short = lr.classification.replace(/^runs\//, '')
                            files.push({ label: short, path: lr.classification })
                        }
                        if (lr.segmentation) {
                            const short = lr.segmentation.replace(/^runs\//, '')
                            files.push({ label: short, path: lr.segmentation })
                        }
                    }
                    return files
                },
                async fetchFileContent(filePath) {
                    this.fileLoading = true
                    this.selectedFilePath = filePath
                    this.selectedFileContent = ''
                    try {
                        const url = `${this.API_BASE}/tasks/${this.taskId}/files/${filePath}`
                        const res = await fetch(url)
                        if (!res.ok) throw new Error(`HTTP ${res.status}`)
                        const text = await res.text()
                        try {
                            const parsed = JSON.parse(text)
                            this.selectedFileContent = JSON.stringify(parsed, null, 2)
                        } catch {
                            this.selectedFileContent = text
                        }
                    } catch (err) {
                        this.selectedFileContent = `// 读取失败: ${err.message}`
                    } finally {
                        this.fileLoading = false
                    }
                },
                selectFile(f) {
                    if (this.selectedFilePath === f.path) return
                    this.fetchFileContent(f.path)
                },
                async runAndGetResult(taskId) {
                    this.statusText = '<span class="loading-spinner"></span>运行模型中...'

                    const runResponse = await fetch(`${this.API_BASE}/tasks/${taskId}/run-async`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ threshold: 0.5 }),
                    })

                    if (!runResponse.ok) {
                        throw new Error(`运行模型失败: ${runResponse.status}`)
                    }

                    const deadline = Date.now() + 120000
                    while (Date.now() < deadline) {
                        const resultResponse = await fetch(`${this.API_BASE}/tasks/${taskId}`)
                        if (!resultResponse.ok) {
                            throw new Error(`获取结果失败: ${resultResponse.status}`)
                        }

                        const resultData = await resultResponse.json()
                        if (resultData.status === 'succeeded' || resultData.status === 'completed') {
                            this.statusText = '<span class="status-success">✓ 识别完成</span>'
                            this.jsonPath = `output/${taskId}/frontend_result.json`

                            const fr = resultData.frontend_result || resultData

                            this.jsonData = JSON.stringify(fr, null, 2)

                            if (fr.classification) {
                                const c = fr.classification
                                this.classificationLabel = c.class === 'yes' ? '肿瘤 detected' : '正常'
                                this.confidence = c.confidence
                            }
                            if (fr.segmentation) {
                                this.tumorArea = fr.segmentation.tumor_area_ratio
                            }

                            this.fileList = this.buildFileList(fr)
                            if (this.fileList.length) {
                                this.fetchFileContent(this.fileList[0].path)
                            }
                            return
                        }
                        if (resultData.status === 'failed') {
                            throw new Error(resultData.error?.message || '识别任务失败')
                        }

                        this.statusText = resultData.status === 'queued'
                            ? '<span class="loading-spinner"></span>任务排队中...'
                            : '<span class="loading-spinner"></span>运行模型中...'
                        await new Promise(resolve => setTimeout(resolve, 1000))
                    }

                    throw new Error('识别任务超时，请稍后重试')
                },
                triggerFilePicker() {
                    this.$refs.fileInput.click()
                },
                async onFileSelected(event) {
                    const file = event.target.files[0]
                    if (!file) return
                    this.selectedFile = file
                },
                async recognizeFromUpload() {
                    if (!this.selectedFile) return
                    this.resetState()

                    try {
                        const formData = new FormData()
                        formData.append('file', this.selectedFile)
                        formData.append('name', 'vue-recognize')

                        const createResponse = await fetch(`${this.API_BASE}/tasks`, {
                            method: 'POST',
                            body: formData,
                        })

                        if (!createResponse.ok) {
                            throw new Error(`创建任务失败: ${createResponse.status}`)
                        }

                        const createData = await createResponse.json()
                        this.taskId = createData.task_id

                        await this.runAndGetResult(this.taskId)
                    } catch (error) {
                        this.statusText = `<span class="status-error">✗ ${error.message}</span>`
                        console.error('识别错误:', error)
                    } finally {
                        this.loading = false
                    }
                },
                onDragEnter(e) {
                    if (e.dataTransfer.types.includes('Files')) {
                        this.isDragOver = true
                    }
                },
                onDragOver(e) {
                    e.dataTransfer.dropEffect = 'copy'
                },
                onDragLeave(e) {
                    if (!e.currentTarget.contains(e.relatedTarget)) {
                        this.isDragOver = false
                    }
                },
                async onDrop(e) {
                    this.isDragOver = false
                    const file = e.dataTransfer.files[0]
                    if (!file) return

                    const validTypes = [
                        'image/jpeg',
                        'image/png',
                        'image/bmp',
                        'image/tiff',
                        'image/webp',
                        'image/gif',
                    ]
                    if (
                        !validTypes.includes(file.type) &&
                        !file.name.match(/\.(jpg|jpeg|png|bmp|tif|tiff|webp|gif|dcm|dicom)$/i)
                    ) {
                        alert('请拖入图片文件（支持 JPG/PNG/BMP/TIFF/WebP/GIF/DICOM）')
                        return
                    }

                    this.selectedFile = file
                },
                copyJson() {
                    const text = this.selectedFileContent
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast = true
                        setTimeout(() => { this.showToast = false }, 2000)
                    }).catch(() => {
                        const ta = document.createElement('textarea')
                        ta.value = text
                        document.body.appendChild(ta)
                        ta.select()
                        document.execCommand('copy')
                        document.body.removeChild(ta)
                        this.showToast = true
                        setTimeout(() => { this.showToast = false }, 2000)
                    })
                },
            },
        }).mount('#app')
    </script>
</body>
</html>
