<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脑肿瘤MRI图像识别</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }
        
        .result-title {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
        }
        
        .result-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            min-height: 100px;
        }
        
        .result-item {
            margin-bottom: 12px;
        }
        
        .result-label {
            color: #666;
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        .result-value {
            color: #333;
            font-size: 14px;
            word-break: break-all;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        
        .status-loading {
            color: #667eea;
            font-style: italic;
        }
        
        .status-error {
            color: #e74c3c;
        }
        
        .status-success {
            color: #27ae60;
        }
        
        .json-display {
            background: #2d2d2d;
            color: #f8f8f2;
            border-radius: 8px;
            padding: 16px;
            margin-top: 15px;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>脑肿瘤MRI图像识别</h1>
        
        <div class="input-group">
            <label for="imagePath">图片路径：</label>
            <input type="text" id="imagePath" placeholder="例如：E:/dataset/example.jpg">
        </div>
        
        <button id="recognizeBtn" onclick="recognize()">识别</button>
        
        <div class="result-section">
            <div class="result-title">识别结果</div>
            <div class="result-box" id="resultBox">
                <div class="result-item">
                    <div class="result-label">状态：</div>
                    <div class="result-value" id="statusText">等待识别...</div>
                </div>
                <div class="result-item" id="taskIdSection" style="display: none;">
                    <div class="result-label">任务ID：</div>
                    <div class="result-value" id="taskIdText"></div>
                </div>
                <div class="result-item" id="jsonPathSection" style="display: none;">
                    <div class="result-label">JSON路径：</div>
                    <div class="result-value" id="jsonPathText"></div>
                </div>
            </div>
            <div class="json-display" id="jsonDisplay" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        
        async function recognize() {
            const imagePath = document.getElementById('imagePath').value.trim();
            
            if (!imagePath) {
                alert('请输入图片路径');
                return;
            }
            
            const btn = document.getElementById('recognizeBtn');
            const statusText = document.getElementById('statusText');
            const taskIdSection = document.getElementById('taskIdSection');
            const jsonPathSection = document.getElementById('jsonPathSection');
            const jsonDisplay = document.getElementById('jsonDisplay');
            
            btn.disabled = true;
            statusText.innerHTML = '<span class="loading-spinner"></span>创建任务中...';
            taskIdSection.style.display = 'none';
            jsonPathSection.style.display = 'none';
            jsonDisplay.style.display = 'none';
            
            try {
                const createResponse = await fetch(`${API_BASE}/tasks/from-path`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        image_path: imagePath,
                        name: 'web-recognize',
                        input_mode: 'auto'
                    })
                });
                
                if (!createResponse.ok) {
                    throw new Error(`创建任务失败: ${createResponse.status}`);
                }
                
                const createData = await createResponse.json();
                const taskId = createData.task_id;
                
                statusText.innerHTML = '<span class="loading-spinner"></span>运行模型中...';
                taskIdSection.style.display = 'block';
                document.getElementById('taskIdText').textContent = taskId;
                
                const runResponse = await fetch(`${API_BASE}/tasks/${taskId}/run`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        threshold: 0.5
                    })
                });
                
                if (!runResponse.ok) {
                    throw new Error(`运行模型失败: ${runResponse.status}`);
                }
                
                statusText.innerHTML = '<span class="loading-spinner"></span>获取结果中...';
                
                const resultResponse = await fetch(`${API_BASE}/tasks/${taskId}`);
                
                if (!resultResponse.ok) {
                    throw new Error(`获取结果失败: ${resultResponse.status}`);
                }
                
                const resultData = await resultResponse.json();
                
                statusText.innerHTML = '<span class="status-success">✓ 识别完成</span>';
                jsonPathSection.style.display = 'block';
                document.getElementById('jsonPathText').textContent = `output/${taskId}/frontend_result.json`;
                
                jsonDisplay.style.display = 'block';
                jsonDisplay.textContent = JSON.stringify(resultData, null, 2);
                
            } catch (error) {
                statusText.innerHTML = `<span class="status-error">✗ ${error.message}</span>`;
                console.error('识别错误:', error);
            } finally {
                btn.disabled = false;
            }
        }
        
        document.getElementById('imagePath').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                recognize();
            }
        });
    </script>
</body>
</html>
