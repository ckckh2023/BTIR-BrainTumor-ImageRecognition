<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智瞳医脑 - 脑肿瘤MRI影像智能辅助诊断系统</title>
    <link rel="icon" type="image/png" href="/assets/icon_exp.png">
    <!-- Vue 3.5.41 本地化（源：unpkg 官方包，避免内网依赖外网） -->
    <script src="./vendor/vue.global.js"></script>
    <script>
        (function () {
            var theme = 'light'
            try {
                theme = localStorage.getItem('btir_theme') || 'light'
            } catch (e) { /* 忽略存储不可用 */ }
            document.documentElement.setAttribute('data-theme', theme)
        })()
    </script>
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./auth.css">
    <style>
        .tabs {
            display: flex;
            gap: 4px;
            padding: 3px;
            background: var(--btir-bg);
            border-radius: var(--btir-radius-md);
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 8px 16px;
            color: var(--btir-text-secondary);
            background: transparent;
            border: none;
            border-radius: var(--btir-radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--btir-transition);
        }

        .tab:hover:not(.active) {
            color: var(--btir-primary);
            background: var(--btir-surface);
        }

        .tab:active {
            transform: scale(0.98);
        }

        .tab.active {
            color: white;
            background: var(--btir-primary);
        }
    </style>

</head>
<body>
    <div id="app" v-cloak>
        <div class="auth-card">
            <button
                type="button"
                class="theme-toggle"
                :title="theme === 'dark' ? '切换到浅色模式' : '切换到深色模式'"
                @click="toggleTheme"
            >
                <svg v-if="theme === 'dark'" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="8" cy="8" r="3.2"></circle>
                    <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.7 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"></path>
                </svg>
                <svg v-else viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 9.5A5.5 5.5 0 0 1 6.5 3 5.5 5.5 0 1 0 13 9.5Z"></path>
                </svg>
            </button>
            <h1>智瞳医脑</h1>
            <p class="auth-card-subtitle">脑肿瘤MRI影像智能辅助诊断系统</p>

            <div class="tabs">
                <button :class="['tab', { active: mode === 'login' }]" @click="switchMode('login')">登录</button>
                <button :class="['tab', { active: mode === 'register' }]" @click="switchMode('register')">注册</button>
            </div>

            <div v-if="msg" :class="['message', msgType]">{{ msg }}</div>

            <form @submit.prevent="submit">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input
                        id="username"
                        data-testid="login-username"
                        v-model.trim="username"
                        type="text"
                        placeholder="请输入用户名"
                        autocomplete="username"
                    />
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input
                        id="password"
                        data-testid="login-password"
                        v-model="password"
                        type="password"
                        placeholder="请输入密码"
                        autocomplete="current-password"
                    />
                </div>

                <button class="submit-btn" data-testid="login-submit" type="submit" :disabled="loading">
                    <span v-if="loading" class="loading-spinner"></span>
                    {{ mode === 'login' ? '登录' : '注册' }}
                </button>
            </form>
        </div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    API_BASE: '',
                    mode: 'login',
                    username: '',
                    password: '',
                    loading: false,
                    msg: '',
                    msgType: 'error',
                    theme: 'light',
                }
            },
            methods: {
                applyTheme() {
                    document.documentElement.setAttribute('data-theme', this.theme)
                },
                toggleTheme() {
                    this.theme = this.theme === 'dark' ? 'light' : 'dark'
                    localStorage.setItem('btir_theme', this.theme)
                    this.applyTheme()
                },
                switchMode(mode) {
                    this.mode = mode
                    this.msg = ''
                    this.msgType = 'error'
                },
                credentialsValidationMessage() {
                    if (!this.username) {
                        return '请输入用户名'
                    }
                    const usernameLength = Array.from(this.username).length
                    const usernameMinLength = /^[\x00-\x7F]+$/.test(this.username) ? 3 : 2
                    if (usernameLength < usernameMinLength || usernameLength > 32) {
                        return '用户名长度应为 2 至 32 个字符，纯英文或数字用户名至少 3 个字符'
                    }
                    if (!/^[\p{L}\p{M}\p{N}_-]+$/u.test(this.username)) {
                        return '用户名仅支持各语言的字母、数字、下划线和连字符'
                    }
                    if (!this.password) {
                        return '请输入密码'
                    }
                    if (this.password.length < 6 || this.password.length > 72) {
                        return '密码长度应为 6 至 72 个字符'
                    }
                    if (new TextEncoder().encode(this.password).length > 72) {
                        return '密码的 UTF-8 编码不能超过 72 字节'
                    }
                    return ''
                },
                async responseErrorMessage(response, fallback) {
                    const data = await response.json().catch(() => ({}))
                    if (typeof data.detail === 'string' && data.detail) {
                        return data.detail
                    }
                    if (Array.isArray(data.detail) && typeof data.detail[0]?.msg === 'string') {
                        return data.detail[0].msg.replace(/^Value error,\s*/, '')
                    }
                    return fallback
                },
                async submit() {
                    this.msg = ''
                    const validationMessage = this.credentialsValidationMessage()
                    if (validationMessage) {
                        this.msg = validationMessage
                        this.msgType = 'error'
                        return
                    }
                    this.loading = true

                    try {
                        if (this.mode === 'register') {
                            const res = await fetch(`${this.API_BASE}/auth/register`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    username: this.username,
                                    password: this.password,
                                }),
                            })
                            if (!res.ok) {
                                throw new Error(await this.responseErrorMessage(res, `注册失败：HTTP ${res.status}`))
                            }
                            const data = await res.json()
                            this.onAuthSuccess(data)
                        } else {
                            const res = await fetch(`${this.API_BASE}/auth/login`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    username: this.username,
                                    password: this.password,
                                }),
                            })
                            if (!res.ok) {
                                throw new Error(await this.responseErrorMessage(res, `登录失败：HTTP ${res.status}`))
                            }
                            const data = await res.json()
                            this.onAuthSuccess(data)
                        }
                    } catch (err) {
                        this.msg = err.message
                        this.msgType = 'error'
                    } finally {
                        this.loading = false
                    }
                },
                onAuthSuccess(data) {
                    localStorage.setItem('btir_token', data.access_token)
                    localStorage.setItem('btir_user', JSON.stringify({
                        user_id: data.user_id,
                        username: data.username,
                    }))
                    if (data.must_change_password) {
                        window.location.href = '/web/change-password.html'
                        return
                    }
                    window.location.href = '/web/'
                },
            },
            async mounted() {
                const savedTheme = localStorage.getItem('btir_theme')
                this.theme = savedTheme || 'light'
                this.applyTheme()

                const token = localStorage.getItem('btir_token')
                if (!token) return
                try {
                    const response = await fetch(`${this.API_BASE}/auth/me`, {
                        headers: { 'Authorization': `Bearer ${token}` },
                    })
                    if (response.ok) {
                        window.location.href = '/web/'
                        return
                    }
                } catch {
                }
                if (token) {
                    localStorage.removeItem('btir_token')
                    localStorage.removeItem('btir_user')
                }
            },
        }).mount('#app')
    </script>
</body>
</html>
