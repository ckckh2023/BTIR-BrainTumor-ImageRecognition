<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智瞳医脑 - 脑肿瘤MRI影像智能辅助诊断系统</title>
    <link rel="icon" type="image/png" href="/assets/icon_exp.png">
    <!-- Vue 3.5.41 本地化（源：unpkg 官方包，避免内网依赖外网） -->
    <script src="./vendor/vue.global.js"></script>
    <script src="./scripts/theme-init.js"></script>
    <link rel="stylesheet" href="./styles/theme.css">
    <link rel="stylesheet" href="./styles/controls.css">
    <link rel="stylesheet" href="./styles/auth.css">
    <link rel="stylesheet" href="./styles/login.css">

</head>
<body>
    <div id="app" v-cloak>
        <div class="auth-card auth-card-with-download-entry">
            <a class="client-download-entry btir-icon-button" href="./download.html" title="客户端下载" aria-label="客户端下载">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3v12m-5-5 5 5 5-5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path>
                </svg>
            </a>
            <button
                type="button"
                class="theme-toggle btir-icon-button"
                :title="theme === 'dark' ? '切换到浅色模式' : '切换到深色模式'"
                @click="toggleTheme"
            >
                <svg v-if="theme === 'dark'" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="8" cy="8" r="3.2"></circle>
                    <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.7 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"></path>
                </svg>
                <svg v-else viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 9.5A5.5 5.5 0 0 1 6.5 3 5.5 5.5 0 1 0 13 9.5Z"></path>
                </svg>
            </button>
            <h1>智瞳医脑</h1>
            <p class="auth-card-subtitle">脑肿瘤MRI影像智能辅助诊断系统</p>

            <div class="tabs">
                <button :class="['tab', { active: mode === 'login' }]" @click="switchMode('login')">登录</button>
                <button :class="['tab', { active: mode === 'register' }]" @click="switchMode('register')">注册</button>
            </div>

            <div v-if="msg" :class="['message', msgType]">{{ msg }}</div>

            <form @submit.prevent="submit">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input
                        id="username"
                        data-testid="login-username"
                        v-model.trim="username"
                        type="text"
                        placeholder="请输入用户名"
                        autocomplete="username"
                    />
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input
                        id="password"
                        data-testid="login-password"
                        v-model="password"
                        type="password"
                        placeholder="请输入密码"
                        autocomplete="current-password"
                    />
                </div>

                <button class="submit-btn" data-testid="login-submit" type="submit" :disabled="loading">
                    <span v-if="loading" class="loading-spinner"></span>
                    {{ mode === 'login' ? '登录' : '注册' }}
                </button>
            </form>
        </div>
    </div>

    <script src="./scripts/login.js"></script>
</body>
</html>
