<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 脑肿瘤MRI图像识别</title>
    <link rel="icon" type="image/png" href="/assets/icon_exp.png">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        (function () {
            var theme = 'light'
            try {
                theme = localStorage.getItem('btir_theme') || 'light'
            } catch (e) { /* 忽略存储不可用 */ }
            document.documentElement.setAttribute('data-theme', theme)
        })()
    </script>
    <link rel="stylesheet" href="./theme.css">
    <style>
body {
            font-family: var(--btir-font);
            background: linear-gradient(160deg, var(--btir-bg) 0%, var(--btir-bg-soft) 100%);
            color: var(--btir-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 32px;
            padding: 0;
            color: var(--btir-text-secondary);
            background: var(--btir-surface);
            border: 1px solid var(--btir-border-strong);
            border-radius: var(--btir-radius-sm);
            cursor: pointer;
            box-shadow: var(--btir-shadow-sm);
            transition: all var(--btir-transition);
        }

        .theme-toggle:hover {
            color: #ffffff;
            background: var(--btir-primary);
            border-color: var(--btir-primary);
            transform: translateY(-1px);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .theme-toggle svg {
            vertical-align: middle;
        }

        .auth-card {
            position: relative;
            background: var(--btir-surface);
            border: 1px solid var(--btir-border);
            border-radius: var(--btir-radius-lg);
            box-shadow: var(--btir-shadow-lg);
            padding: 44px 48px;
            width: 470px;
            max-width: 100%;
            animation: slide-up 0.3s ease;
        }

        .auth-card .theme-toggle {
            position: absolute;
            top: 14px;
            right: 14px;
            box-shadow: none;
            background: transparent;
            border-color: transparent;
        }

        .auth-card .theme-toggle:hover {
            background: var(--btir-primary-soft);
            border-color: transparent;
        }

        h1 {
            color: var(--btir-primary);
            margin-bottom: 22px;
            font-size: 24px;
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 4px;
            padding: 3px;
            background: var(--btir-bg);
            border-radius: var(--btir-radius-md);
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 8px 16px;
            color: var(--btir-text-secondary);
            background: transparent;
            border: none;
            border-radius: var(--btir-radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--btir-transition);
        }

        .tab:hover:not(.active) {
            color: var(--btir-primary);
            background: var(--btir-surface);
        }

        .tab:active {
            transform: scale(0.98);
        }

        .tab.active {
            color: white;
            background: var(--btir-primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--btir-accent);
            font-weight: 500;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            color: var(--btir-text);
            background: var(--btir-surface-muted);
            border: 1px solid var(--btir-border-strong);
            border-radius: var(--btir-radius-sm);
            font-size: 14px;
            transition: border-color var(--btir-transition), box-shadow var(--btir-transition);
        }

        input:hover {
            border-color: var(--btir-accent);
        }

        input:focus {
            outline: none;
            border-color: var(--btir-accent);
            box-shadow: 0 0 0 3px rgba(64, 126, 184, 0.14);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(160deg, var(--btir-primary-hover) 0%, var(--btir-primary) 100%);
            color: white;
            border: none;
            border-radius: var(--btir-radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--btir-transition);
            margin-top: 8px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.32);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            padding: 10px 12px;
            margin-bottom: 16px;
            border-radius: var(--btir-radius-sm);
            font-size: 13px;
            line-height: 1.5;
            animation: fade-in 0.2s ease;
        }

        .message.error {
            color: var(--btir-danger);
            background: var(--btir-danger-bg);
        }

        .message.success {
            color: var(--btir-success);
            background: var(--btir-success-bg);
        }

        [data-theme="dark"] .message.error {
            color: #fca5a5;
            background: #3b1a1a;
        }

        [data-theme="dark"] .message.success {
            color: #86efac;
            background: #14351f;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>
<body>
    <div id="app">
        <div class="auth-card">
            <button
                type="button"
                class="theme-toggle"
                :title="theme === 'dark' ? '切换到浅色模式' : '切换到深色模式'"
                @click="toggleTheme"
            >
                <svg v-if="theme === 'dark'" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="8" cy="8" r="3.2"></circle>
                    <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.7 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"></path>
                </svg>
                <svg v-else viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 9.5A5.5 5.5 0 0 1 6.5 3 5.5 5.5 0 1 0 13 9.5Z"></path>
                </svg>
            </button>
            <h1>脑肿瘤MRI图像识别</h1>

            <div class="tabs">
                <button :class="['tab', { active: mode === 'login' }]" @click="switchMode('login')">登录</button>
                <button :class="['tab', { active: mode === 'register' }]" @click="switchMode('register')">注册</button>
            </div>

            <div v-if="msg" :class="['message', msgType]">{{ msg }}</div>

            <form @submit.prevent="submit">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input
                        id="username"
                        data-testid="login-username"
                        v-model.trim="username"
                        type="text"
                        placeholder="请输入用户名"
                        autocomplete="username"
                    />
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input
                        id="password"
                        data-testid="login-password"
                        v-model="password"
                        type="password"
                        placeholder="请输入密码"
                        autocomplete="current-password"
                    />
                </div>

                <button class="submit-btn" data-testid="login-submit" type="submit" :disabled="loading">
                    <span v-if="loading" class="loading-spinner"></span>
                    {{ mode === 'login' ? '登录' : '注册' }}
                </button>
            </form>
        </div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    API_BASE: '',
                    mode: 'login',
                    username: '',
                    password: '',
                    loading: false,
                    msg: '',
                    msgType: 'error',
                    theme: 'light',
                }
            },
            methods: {
                applyTheme() {
                    document.documentElement.setAttribute('data-theme', this.theme)
                },
                toggleTheme() {
                    this.theme = this.theme === 'dark' ? 'light' : 'dark'
                    localStorage.setItem('btir_theme', this.theme)
                    this.applyTheme()
                },
                switchMode(mode) {
                    this.mode = mode
                    this.msg = ''
                    this.msgType = 'error'
                },
                credentialsValidationMessage() {
                    if (!this.username) {
                        return '请输入用户名'
                    }
                    const usernameLength = Array.from(this.username).length
                    const usernameMinLength = /^[\x00-\x7F]+$/.test(this.username) ? 3 : 2
                    if (usernameLength < usernameMinLength || usernameLength > 32) {
                        return '用户名长度应为 2 至 32 个字符，纯英文或数字用户名至少 3 个字符'
                    }
                    if (!/^[\p{L}\p{M}\p{N}_-]+$/u.test(this.username)) {
                        return '用户名仅支持各语言的字母、数字、下划线和连字符'
                    }
                    if (!this.password) {
                        return '请输入密码'
                    }
                    if (this.password.length < 6 || this.password.length > 72) {
                        return '密码长度应为 6 至 72 个字符'
                    }
                    if (new TextEncoder().encode(this.password).length > 72) {
                        return '密码的 UTF-8 编码不能超过 72 字节'
                    }
                    return ''
                },
                async responseErrorMessage(response, fallback) {
                    const data = await response.json().catch(() => ({}))
                    if (typeof data.detail === 'string' && data.detail) {
                        return data.detail
                    }
                    if (Array.isArray(data.detail) && typeof data.detail[0]?.msg === 'string') {
                        return data.detail[0].msg.replace(/^Value error,\s*/, '')
                    }
                    return fallback
                },
                async submit() {
                    this.msg = ''
                    const validationMessage = this.credentialsValidationMessage()
                    if (validationMessage) {
                        this.msg = validationMessage
                        this.msgType = 'error'
                        return
                    }
                    this.loading = true

                    try {
                        if (this.mode === 'register') {
                            const res = await fetch(`${this.API_BASE}/auth/register`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    username: this.username,
                                    password: this.password,
                                }),
                            })
                            if (!res.ok) {
                                throw new Error(await this.responseErrorMessage(res, `注册失败：HTTP ${res.status}`))
                            }
                            const data = await res.json()
                            this.onAuthSuccess(data)
                        } else {
                            const res = await fetch(`${this.API_BASE}/auth/login`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    username: this.username,
                                    password: this.password,
                                }),
                            })
                            if (!res.ok) {
                                throw new Error(await this.responseErrorMessage(res, `登录失败：HTTP ${res.status}`))
                            }
                            const data = await res.json()
                            this.onAuthSuccess(data)
                        }
                    } catch (err) {
                        this.msg = err.message
                        this.msgType = 'error'
                    } finally {
                        this.loading = false
                    }
                },
                onAuthSuccess(data) {
                    localStorage.setItem('btir_token', data.access_token)
                    localStorage.setItem('btir_user', JSON.stringify({
                        user_id: data.user_id,
                        username: data.username,
                    }))
                    window.location.href = '/web/'
                },
            },
            async mounted() {
                const savedTheme = localStorage.getItem('btir_theme')
                this.theme = savedTheme || 'light'
                this.applyTheme()

                const token = localStorage.getItem('btir_token')
                if (!token) return
                try {
                    const response = await fetch(`${this.API_BASE}/auth/me`, {
                        headers: { 'Authorization': `Bearer ${token}` },
                    })
                    if (response.ok) {
                        window.location.href = '/web/'
                        return
                    }
                } catch {
                }
                if (token) {
                    localStorage.removeItem('btir_token')
                    localStorage.removeItem('btir_user')
                }
            },
        }).mount('#app')
    </script>
</body>
</html>
