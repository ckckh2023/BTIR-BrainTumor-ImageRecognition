<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户端下载 - 智瞳医脑</title>
    <link rel="icon" type="image/png" href="/assets/icon_exp.png">
    <script>
        (function () {
            var theme = 'light'
            try {
                theme = localStorage.getItem('btir_theme') || 'light'
            } catch (e) { /* 忽略存储不可用 */ }
            document.documentElement.setAttribute('data-theme', theme)
        })()
    </script>
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./download.css">
</head>
<body>
    <header class="download-header">
        <a class="download-back" id="downloadBack" href="./index.html">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"></path></svg>
            返回
        </a>
        <span class="download-title">客户端下载</span>
        <button class="download-theme" id="downloadTheme" type="button" title="切换到深色模式" aria-label="切换到深色模式">
            <svg class="theme-moon" viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3 5.5 5.5 0 1 0 13 9.5Z"></path></svg>
            <svg class="theme-sun" viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.2"></circle><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.7 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"></path></svg>
        </button>
    </header>

    <main class="download-main">
        <section class="download-hero" aria-labelledby="downloadHeading">
            <span class="download-logo" role="img" aria-label="智瞳医脑"></span>
            <div>
                <h1 id="downloadHeading">智瞳医脑客户端</h1>
                <p>请选择对应设备平台进行下载</p>
            </div>
        </section>

        <section aria-label="客户端平台">
            <div class="download-grid">
                <article class="download-card" aria-labelledby="desktopHeading">
                    <div class="download-card-heading">
                        <span class="download-device" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="13" rx="2"></rect><path d="M8 21h8m-4-5v5"></path></svg>
                        </span>
                        <h2 id="desktopHeading">PC 端</h2>
                    </div>
                    <ul class="download-platforms" aria-label="支持的平台">
                        <li>
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="m2 5 9-1.3v7.5H2zm10.5-1.5L22 2v9.2h-9.5zM2 12.8h9v7.5L2 19zm10.5 0H22V22l-9.5-1.4z"></path></svg>
                            Windows
                        </li>
                        <li>
                            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M12 2c-3 0-4.2 2.7-4 5.6.1 2-1.4 3.9-2.5 6.2-1.5 3.3-.3 6.4 3.1 6.4h6.8c3.4 0 4.6-3.1 3.1-6.4C17.4 11.5 15.9 9.6 16 7.6 16.2 4.7 15 2 12 2Z"></path><ellipse cx="12" cy="14.5" rx="4" ry="5" fill="var(--btir-surface)"></ellipse><ellipse cx="10.5" cy="7" rx="1.1" ry="1.6" fill="var(--btir-surface)"></ellipse><ellipse cx="13.5" cy="7" rx="1.1" ry="1.6" fill="var(--btir-surface)"></ellipse><path d="m10 9 2-1 2 1-2 2zM5 18l4 1 1 3H3zm14 0-4 1-1 3h7z" fill="currentColor"></path></svg>
                            Linux
                        </li>
                    </ul>
                    <p class="download-release-status" data-release-status="pc" role="status">查看客户端分支与安装说明</p>
                    <a class="download-action" data-client="pc" href="https://github.com/ckckh2023/BTIR-Client/tree/PC" target="_blank" rel="noopener noreferrer" aria-label="前往 GitHub 获取 PC 客户端（新标签页）">
                        <span>前往 GitHub 获取</span>
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"></path></svg>
                    </a>
                </article>

                <article class="download-card" aria-labelledby="harmonyHeading">
                    <div class="download-card-heading">
                        <span class="download-device" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M10 5h4m-3 14h2"></path></svg>
                        </span>
                        <h2 id="harmonyHeading">鸿蒙手机端</h2>
                    </div>
                    <ul class="download-platforms" aria-label="支持的平台">
                        <li>
                            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M5 21h14"></path></svg>
                            HarmonyOS
                        </li>
                    </ul>
                    <p class="download-release-status" data-release-status="harmony" role="status">查看客户端分支与安装说明</p>
                    <a class="download-action" data-client="harmony" href="https://github.com/ckckh2023/BTIR-Client/tree/Mobile-HarmonyOS" target="_blank" rel="noopener noreferrer" aria-label="前往 GitHub 获取鸿蒙客户端（新标签页）">
                        <span>前往 GitHub 获取</span>
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"></path></svg>
                    </a>
                </article>
            </div>
        </section>

        <p class="download-note">客户端需连接 BTIR 服务端</p>
    </main>

    <script>
        (function () {
            const themeButton = document.getElementById('downloadTheme')
            const applyTheme = (theme) => {
                document.documentElement.setAttribute('data-theme', theme)
                const label = theme === 'dark' ? '切换到浅色模式' : '切换到深色模式'
                themeButton.title = label
                themeButton.setAttribute('aria-label', label)
            }
            applyTheme(document.documentElement.getAttribute('data-theme'))
            themeButton.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
                applyTheme(next)
                try { localStorage.setItem('btir_theme', next) } catch (e) { /* 忽略存储不可用 */ }
            })
            window.addEventListener('storage', (event) => {
                if (event.key === 'btir_theme' || event.key === null) applyTheme(event.newValue === 'dark' ? 'dark' : 'light')
            })
            // 返回实际来源，保留工作区或登录页的浏览历史；直接访问时回到首页。
            try {
                const source = new URL(document.referrer)
                if (source.origin === location.origin && /\/(?:index\.html|login\.html|about\.html|web\/?|login\/?)$/.test(source.pathname)) {
                    const back = document.getElementById('downloadBack')
                    back.href = source.href
                    back.addEventListener('click', (event) => {
                        if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return
                        if (history.length > 1) {
                            event.preventDefault()
                            history.back()
                        }
                    })
                }
            } catch (e) { /* 无来源时使用首页链接 */ }
        })()
    </script>
    <script src="./download.js"></script>
</body>
</html>
