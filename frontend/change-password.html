<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 智瞳医脑 - 脑肿瘤MRI影像智能辅助诊断系统</title>
    <link rel="icon" type="image/png" href="/assets/icon_exp.png">
    <!-- Vue 无需在此页加载，使用原生脚本 -->
    <script>
        (function () {
            var theme = 'light'
            try {
                theme = localStorage.getItem('btir_theme') || 'light'
            } catch (e) { /* 忽略存储不可用 */ }
            document.documentElement.setAttribute('data-theme', theme)
        })()
    </script>
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./auth.css">
</head>
<body>
    <div class="auth-card">
        <button type="button" class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">
            <svg class="guide-icon-dark" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none">
                <circle cx="8" cy="8" r="3.2"></circle>
                <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.7 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"></path>
            </svg>
            <svg class="guide-icon-light" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 9.5A5.5 5.5 0 0 1 6.5 3 5.5 5.5 0 1 0 13 9.5Z"></path>
            </svg>
        </button>

        <h1>修改密码</h1>

        <div id="message" class="message" style="display:none"></div>

        <form id="changeForm" novalidate>
            <div class="form-group">
                <label for="currentPassword">当前密码</label>
                <input
                    type="password"
                    id="currentPassword"
                    autocomplete="current-password"
                    placeholder="请输入当前密码"
                    required
                />
            </div>
            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input
                    type="password"
                    id="newPassword"
                    autocomplete="new-password"
                    placeholder="6-72 个字符"
                    required
                />
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    placeholder="再次输入新密码"
                    required
                />
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">确认修改</button>
        </form>

        <div style="text-align:center; margin-top:16px; font-size:13px;">
            <a href="/login/login.html" style="color: var(--btir-accent);">返回登录</a>
        </div>
    </div>

    <script>
        (function () {
            const form = document.getElementById('changeForm')
            const submitBtn = document.getElementById('submitBtn')
            const messageBox = document.getElementById('message')

            const showMessage = (text, type) => {
                messageBox.textContent = text
                messageBox.className = `message ${type}`
                messageBox.style.display = 'block'
            }
            const hideMessage = () => {
                messageBox.style.display = 'none'
            }

            const themeButton = document.getElementById('themeToggle')
            const applyTheme = (theme) => {
                document.documentElement.setAttribute('data-theme', theme)
                themeButton.classList.toggle('dark', theme === 'dark')
                document.querySelector('.guide-icon-dark').style.display = theme === 'dark' ? '' : 'none'
                document.querySelector('.guide-icon-light').style.display = theme === 'dark' ? 'none' : ''
            }
            themeButton.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark'
                    ? 'light'
                    : 'dark'
                localStorage.setItem('btir_theme', next)
                applyTheme(next)
            })
            applyTheme(localStorage.getItem('btir_theme') || 'light')

            // 未登录（无令牌）直接回登录页
            if (!localStorage.getItem('btir_token')) {
                window.location.href = '/login/login.html'
                return
            }

            const authHeaders = () => {
                const token = localStorage.getItem('btir_token')
                return token ? { 'Authorization': `Bearer ${token}` } : {}
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault()
                hideMessage()

                const currentPassword = document.getElementById('currentPassword').value
                const newPassword = document.getElementById('newPassword').value
                const confirmPassword = document.getElementById('confirmPassword').value

                if (newPassword !== confirmPassword) {
                    showMessage('两次输入的新密码不一致', 'error')
                    return
                }
                if (newPassword.length < 6 || newPassword.length > 72) {
                    showMessage('新密码长度应为 6 至 72 个字符', 'error')
                    return
                }

                submitBtn.disabled = true
                submitBtn.textContent = '提交中...'
                try {
                    const response = await fetch('/auth/change-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...authHeaders(),
                        },
                        body: JSON.stringify({
                            current_password: currentPassword,
                            new_password: newPassword,
                        }),
                    })
                    let data = {}
                    try {
                        data = await response.json()
                    } catch { /* 忽略非 JSON 响应 */ }
                    if (!response.ok) {
                        const detail = typeof data.detail === 'string'
                            ? data.detail
                            : (data.detail?.message || `修改失败：HTTP ${response.status}`)
                        showMessage(detail, 'error')
                        return
                    }
                    if (data.access_token) {
                        localStorage.setItem('btir_token', data.access_token)
                        localStorage.setItem('btir_user', JSON.stringify({
                            user_id: data.user_id,
                            username: data.username,
                        }))
                    }
                    showMessage('密码修改成功，正在进入系统...', 'success')
                    setTimeout(() => {
                        window.location.href = '/web/'
                    }, 600)
                } catch (err) {
                    showMessage(`网络错误：${err.message || '请稍后重试'}`, 'error')
                } finally {
                    submitBtn.disabled = false
                    submitBtn.textContent = '确认修改'
                }
            })
        })()
    </script>
</body>
</html>
