<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 智瞳医脑 - 脑肿瘤MRI影像智能辅助诊断系统</title>
    <link rel="icon" type="image/png" href="/assets/icon_exp.png">
    <!-- Vue 无需在此页加载，使用原生脚本 -->
    <script src="./scripts/theme-init.js"></script>
    <link rel="stylesheet" href="./styles/theme.css">
    <link rel="stylesheet" href="./styles/controls.css">
    <link rel="stylesheet" href="./styles/auth.css">
</head>
<body>
    <div class="auth-card">
        <button type="button" class="theme-toggle btir-icon-button" id="themeToggle" title="切换主题" aria-label="切换主题">
            <svg class="guide-icon-dark" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none">
                <circle cx="8" cy="8" r="3.2"></circle>
                <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.7 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"></path>
            </svg>
            <svg class="guide-icon-light" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 9.5A5.5 5.5 0 0 1 6.5 3 5.5 5.5 0 1 0 13 9.5Z"></path>
            </svg>
        </button>

        <h1>修改密码</h1>

        <div id="message" class="message" style="display:none"></div>

        <form id="changeForm" novalidate>
            <div class="form-group">
                <label for="currentPassword">当前密码</label>
                <input
                    type="password"
                    id="currentPassword"
                    autocomplete="current-password"
                    placeholder="请输入当前密码"
                    required
                />
            </div>
            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input
                    type="password"
                    id="newPassword"
                    autocomplete="new-password"
                    placeholder="6-72 个字符"
                    required
                />
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    placeholder="再次输入新密码"
                    required
                />
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">确认修改</button>
        </form>

        <div style="text-align:center; margin-top:16px; font-size:13px;">
            <a href="./login.html" style="color: var(--btir-accent);">返回登录</a>
        </div>
    </div>

    <script src="./scripts/change-password.js"></script>
</body>
</html>
