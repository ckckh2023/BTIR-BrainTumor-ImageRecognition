<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试样例使用说明</title>
    <link rel="icon" type="image/png" href="/assets/icon_exp.png">
    <script>
        (function () {
            var theme = 'light'
            try {
                theme = localStorage.getItem('btir_theme') || 'light'
            } catch (e) { /* 忽略 */ }
            document.documentElement.setAttribute('data-theme', theme)
        })()
    </script>
    <style>
        :root {
            --btir-primary: #1e3c72;
            --btir-primary-hover: #2d5aa0;
            --btir-primary-soft: #eef4fb;
            --btir-accent: #407eb8;
            --btir-bg: #eef2f7;
            --btir-bg-soft: #e3e9f2;
            --btir-surface: #ffffff;
            --btir-surface-muted: #f8fafc;
            --btir-border: #dbe4ef;
            --btir-border-strong: #b9d2ec;
            --btir-text: #1e293b;
            --btir-text-secondary: #64748b;
            --btir-text-muted: #94a3b8;
            --btir-radius-sm: 6px;
            --btir-radius-md: 10px;
            --btir-radius-lg: 16px;
            --btir-shadow-sm: 0 1px 3px rgba(30, 41, 59, 0.08);
            --btir-shadow-lg: 0 18px 50px rgba(30, 41, 59, 0.22);
            --btir-font: 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', Arial, sans-serif;
            --btir-mono: 'Consolas', 'Monaco', 'SFMono-Regular', monospace;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --btir-primary: #4d7fc2;
            --btir-primary-hover: #5d92d6;
            --btir-primary-soft: #1d3456;
            --btir-accent: #6ea8e8;
            --btir-bg: #0b1220;
            --btir-bg-soft: #131c2e;
            --btir-surface: #16213a;
            --btir-surface-muted: #1b2742;
            --btir-border: #33445f;
            --btir-border-strong: #46597c;
            --btir-text: #f1f5fb;
            --btir-text-secondary: #bccade;
            --btir-text-muted: #8b9cb6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--btir-border-strong);
            border: 2px solid transparent;
            border-radius: 999px;
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--btir-accent);
            background-clip: padding-box;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--btir-border-strong) transparent;
        }

        body {
            font-family: var(--btir-font);
            background: linear-gradient(160deg, var(--btir-bg) 0%, var(--btir-bg-soft) 100%);
            color: var(--btir-text);
            min-height: 100vh;
        }

        .guide-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: var(--btir-surface);
            border-bottom: 1px solid var(--btir-border);
            box-shadow: var(--btir-shadow-sm);
        }

        .guide-back,
        .guide-download {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            color: var(--btir-text-secondary);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 999px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .guide-back:hover {
            color: var(--btir-primary);
            background: var(--btir-primary-soft);
        }

        .guide-download:hover {
            color: #ffffff;
            background: var(--btir-primary);
        }

        .guide-download-meta {
            color: var(--btir-text-muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .guide-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--btir-primary);
        }

        .guide-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .guide-theme {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            color: var(--btir-text-secondary);
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
        }

        .guide-theme:hover {
            color: var(--btir-primary);
            background: var(--btir-primary-soft);
        }

        .guide-theme:active {
            transform: scale(0.92);
        }

        .guide-theme svg {
            vertical-align: middle;
        }

        .guide-theme .guide-icon-dark {
            display: none;
        }

        .guide-theme.dark .guide-icon-light {
            display: none;
        }

        .guide-theme.dark .guide-icon-dark {
            display: inline-block;
        }

        .guide-main {
            max-width: 820px;
            margin: 28px auto;
            padding: 0 20px;
        }

        .guide-card {
            background: var(--btir-surface);
            border: 1px solid var(--btir-border);
            border-radius: var(--btir-radius-md);
            padding: 28px 32px;
            box-shadow: var(--btir-shadow-sm);
            animation: fade-in 0.3s ease;
        }

        .guide-md {
            font-size: 15px;
            line-height: 1.75;
        }

        .guide-md h1 {
            font-size: 22px;
            color: var(--btir-primary);
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--btir-border);
        }

        .guide-md h2 {
            font-size: 17px;
            color: var(--btir-primary);
            margin: 22px 0 10px;
        }

        .guide-md h3 {
            font-size: 15px;
            color: var(--btir-text);
            margin: 18px 0 8px;
        }

        .guide-md p {
            margin: 8px 0;
        }

        .guide-md ul,
        .guide-md ol {
            margin: 8px 0 8px 22px;
        }

        .guide-md li {
            margin: 5px 0;
        }

        .guide-md code {
            padding: 1px 6px;
            border-radius: 4px;
            background: var(--btir-primary-soft);
            color: var(--btir-primary);
            font-family: var(--btir-mono);
            font-size: 0.9em;
        }

        .guide-md strong {
            color: var(--btir-text);
        }

        .guide-md a {
            color: var(--btir-accent);
        }

        .guide-error {
            color: var(--btir-danger, #b42318);
            padding: 12px 0;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header class="guide-header">
        <button type="button" class="guide-back" id="guideBack">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.5 4 5 8l4.5 4"></path>
            </svg>
            返回
        </button>
        <div class="guide-title">测试样例使用说明</div>
        <div class="guide-header-actions">
            <a
                class="guide-download"
                href="/assets/评委测试包_解压后请依照说明文件操作.zip"
                download="测试样例数据包.zip"
                >
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 2.5v7"></path>
                    <path d="M5 6.5 8 9.5l3-3"></path>
                    <path d="M2.5 11v2A1.5 1.5 0 0 0 4 14.5h8a1.5 1.5 0 0 0 1.5-1.5v-2"></path>
                </svg>
                下载测试样例
            </a>
            <span class="guide-download-meta"></span>
            <button type="button" class="guide-theme" id="guideTheme" title="切换主题" aria-label="切换主题">
                <svg class="guide-icon-dark" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="8" cy="8" r="3.2"></circle>
                    <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.7 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"></path>
                </svg>
                <svg class="guide-icon-light" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 9.5A5.5 5.5 0 0 1 6.5 3 5.5 5.5 0 1 0 13 9.5Z"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="guide-main">
        <div class="guide-card">
            <div class="guide-md" id="guideContent">
                <div class="guide-error">正在加载说明...</div>
            </div>
        </div>
    </main>

    <script>
        function renderMarkdown(text) {
            const escapeHtml = (value) => String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
            const inline = (value) => escapeHtml(value)
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')

            const lines = text.split('\n')
            let html = ''
            let listType = null
            let inList = false
            const closeList = () => {
                if (inList) {
                    html += `</${listType}>`
                    inList = false
                    listType = null
                }
            }

            for (const rawLine of lines) {
                const line = rawLine.trimEnd()
                if (!line.trim()) {
                    closeList()
                    continue
                }
                const heading = line.match(/^(#{1,3}) (.*)$/)
                if (heading) {
                    closeList()
                    const level = heading[1].length
                    html += `<h${level}>${inline(heading[2])}</h${level}>`
                    continue
                }
                const unordered = line.match(/^\s*[-*] (.*)$/)
                if (unordered) {
                    if (!inList || listType !== 'ul') {
                        closeList()
                        listType = 'ul'
                        inList = true
                        html += '<ul>'
                    }
                    html += `<li>${inline(unordered[1])}</li>`
                    continue
                }
                const ordered = line.match(/^\s*\d+\. (.*)$/)
                if (ordered) {
                    if (!inList || listType !== 'ol') {
                        closeList()
                        listType = 'ol'
                        inList = true
                        html += '<ol>'
                    }
                    html += `<li>${inline(ordered[1])}</li>`
                    continue
                }
                closeList()
                html += `<p>${inline(line)}</p>`
            }
            closeList()
            return html
        }

        function formatFileSize(bytes) {
            if (bytes >= 1000 ** 3) {
                return `${(bytes / (1000 ** 3)).toFixed(2)} GB`
            }
            if (bytes >= 1000 ** 2) {
                return `${(bytes / (1000 ** 2)).toFixed(1)} MB`
            }
            if (bytes >= 1000) {
                return `${(bytes / 1000).toFixed(1)} KB`
            }
            return `${bytes} B`
        }

        ;(function () {
            const content = document.getElementById('guideContent')

            const downloadLink = document.querySelector('.guide-download')
            const sizeLabel = document.querySelector('.guide-download-meta')
            const zipUrl = downloadLink ? downloadLink.getAttribute('href') : null
            if (zipUrl && sizeLabel) {
                fetch(zipUrl, { method: 'HEAD' })
                    .then((response) => {
                        const length = Number(response.headers.get('content-length'))
                        if (Number.isFinite(length) && length > 0) {
                            sizeLabel.textContent = formatFileSize(length)
                        } else {
                            sizeLabel.remove()
                        }
                    })
                    .catch(() => {
                        sizeLabel.remove()
                    })
            }

            fetch('/assets/guide.md')
                .then((response) => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`)
                    }
                    return response.text()
                })
                .then((text) => {
                    content.innerHTML = renderMarkdown(text)
                })
                .catch(() => {
                    content.innerHTML = '<div class="guide-error">说明文件加载失败，请直接下载测试样例后阅读压缩包内的说明。</div>'
                })

            document.getElementById('guideBack').addEventListener('click', () => {
                window.location.href = 'index.html'
            })

            const themeButton = document.getElementById('guideTheme')
            const applyTheme = (theme) => {
                document.documentElement.setAttribute('data-theme', theme)
                themeButton.classList.toggle('dark', theme === 'dark')
            }
            themeButton.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark'
                    ? 'light'
                    : 'dark'
                localStorage.setItem('btir_theme', next)
                applyTheme(next)
            })
            applyTheme(localStorage.getItem('btir_theme') || 'light')
        })()
    </script>
</body>
</html>
